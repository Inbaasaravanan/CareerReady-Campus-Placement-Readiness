spring.application.name=career-ready-backend
server.port=8080

# ============================================================
# DATABASE CONFIGURATION (MySQL 8)
# ============================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:career_ready_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Inbaa@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# JWT SECURITY PROPERTIES
# ============================================================
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# ============================================================
# CORS CONFIGURATION
# ============================================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost,capacitor://localhost,https://localhost

# ============================================================
# READINESS PREDICTION ENGINE CONFIGURATION
# Centralized thresholds for classification
# ============================================================
app.readiness.threshold.highly-ready=85
app.readiness.threshold.ready=70
app.readiness.threshold.needs-improvement=55
app.readiness.model-version=RandomForest-v2.5-ScikitLearn

# ============================================================
# PYTHON FLASK ML MICROSERVICE CONFIGURATION
# ============================================================
ml.service.url=${ML_SERVICE_URL:http://localhost:5000}
ml.service.auto-start=true
ml.service.python-cmd=py -3.13,python

# ============================================================
# SWAGGER / OPENAPI (springdoc)
# ============================================================
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

# ============================================================
# MAIL CONFIGURATION (SMTP)
